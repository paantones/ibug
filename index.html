<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151D26">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>inug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#151D26; --panel:#1E2A35; --line:#31404E;
  --text:#F1EFE9; --dim:#93A4B2;
  --bg:#151D26; --on-bg:#F1EFE9;
}
/* Signalfarben: der ganze Bildschirm ist die Ampel, damit der Zustand
   auch aus einigen Metern Entfernung erkennbar ist. */
body.state-ok   { --bg:#00C853; --on-bg:#04240F; }
body.state-warn { --bg:#FFC400; --on-bg:#2B2000; }
body.state-full { --bg:#E80029; --on-bg:#FFFFFF; }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--on-bg);
  font-family:'Archivo','Helvetica Neue',system-ui,sans-serif;
  transition:background-color .25s ease, color .25s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior:none;
}
button,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;width:100%;outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tabular{font-variant-numeric:tabular-nums}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}
.wrap{width:100%;max-width:34rem;margin:0 auto;padding:24px 20px 40px}
.dim{color:var(--dim)}
.hidden{display:none !important}

/* Sperre */
#lock .wrap{margin-top:auto;margin-bottom:auto}
.eyebrow{font-size:.85rem;color:var(--dim);margin-bottom:6px}
h1{font-size:2rem;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.big-btn{width:100%;background:var(--text);color:var(--ink);border-radius:10px;padding:16px;font-weight:700;font-size:1.05rem;margin-top:14px}
.ghost-btn{width:100%;border:1px solid var(--line);border-radius:10px;padding:16px;font-weight:700;margin-top:14px}
.err{color:#FF1744;font-size:.9rem;margin-top:10px}

/* Liste */
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:100%;text-align:start;display:block}
.row{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.row .card{flex:1}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-name{font-size:1.2rem;font-weight:700}
.card-count{font-size:1.2rem;font-weight:900}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:99px;background:#00C853;transition:width .2s}
.del{border:1px solid #FF1744;color:#FF1744;border-radius:10px;padding:0 16px;font-size:.9rem;font-weight:700}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px}
.empty b{display:block;margin-bottom:4px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:20px}
.form input{background:var(--ink);margin-bottom:12px}
.form-actions{display:flex;gap:10px}
.form-actions .big-btn{margin-top:0;flex:1}
.form-actions .cancel{border:1px solid var(--line);border-radius:10px;padding:0 20px;color:var(--dim)}
.note{font-size:.78rem;line-height:1.5;color:var(--dim);margin-top:28px}

/* Raum */
.bar-top{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 0;gap:12px}
.bar-top button{font-size:.9rem;font-weight:500;opacity:.75}
.bar-top .title{font-weight:700}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px;text-align:center}
.count{font-size:min(38vw,11rem);font-weight:900;line-height:1;letter-spacing:-.045em;transition:transform .15s}
.count.pulse{transform:scale(1.045)}
.of{font-size:1.1rem;font-weight:500;opacity:.7;margin-top:4px}
.gauge{height:10px;width:100%;max-width:24rem;border-radius:99px;background:rgba(0,0,0,.22);overflow:hidden;margin-top:30px}
.gauge>i{display:block;height:100%;border-radius:99px;background:var(--on-bg);transition:width .2s}
.status{margin-top:16px;font-size:1.2rem;font-weight:900;color:var(--on-bg)}
.subtle{margin-top:22px;font-size:.85rem;opacity:.65}
.confirm{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:.9rem}
.confirm .yes{background:var(--on-bg);color:var(--bg);border-radius:8px;padding:8px 14px;font-weight:700}
.pads{display:flex;gap:12px;padding:0 16px 24px;height:32vh;min-height:150px}
.pad{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:18px;transition:transform .12s}
.pad:active{transform:scale(.96)}
.pad .sign{font-size:3.6rem;font-weight:900;line-height:1}
.pad .lbl{margin-top:8px;font-size:1rem;font-weight:700}
.pad.minus{border:3px solid var(--on-bg);opacity:.85}
.pad.minus[disabled]{opacity:.28}
.pad.plus{background:var(--on-bg);color:var(--bg)}

/* Statistik */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .n{font-size:1.85rem;font-weight:900;line-height:1}
.kpi .l{margin-top:8px;font-size:.85rem;color:var(--dim)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 16px 14px}
.chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.chart svg{width:100%;height:auto;display:block}
/* Statusleiste: belegt immer dieselbe Höhe, damit beim Ein- und
   Ausblenden weder Zahl noch Tasten verrutschen. */
.statusbar{flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0 16px;margin-top:8px}
#offline{
  max-width:100%;padding:6px 14px;border-radius:99px;
  font-size:.8rem;font-weight:700;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(-3px);transition:opacity .18s,transform .18s;
  pointer-events:none;
}
#offline.show{opacity:1;transform:none}

/* Sprachauswahl */
.langrow{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:.85rem;color:var(--dim)}
.lang{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:.9rem}

/* Bei Rechts-nach-links-Sprachen zeigt der Zurück-Pfeil in die andere Richtung */
[dir="rtl"] .chev{display:inline-block;transform:scaleX(-1)}

/* Eingangsauswahl */
.ent{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;text-align:start}
.ent .nm{display:block;font-size:1.15rem;font-weight:700}
.ent .st{display:block;font-size:.85rem;margin-top:4px}
.ent .st.free{color:#00C853}
.ent .st.busy{color:#FFC400}
.dot{width:12px;height:12px;border-radius:99px;flex:0 0 12px}

/* Wer steht gerade an welcher Tür – Leiste im Zählbildschirm */
.doors{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.doors::-webkit-scrollbar{display:none}
.doors:empty{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;
  background:rgba(0,0,0,.16);border-radius:99px;padding:6px 12px;
  font-size:.78rem;line-height:1.2;white-space:nowrap;color:var(--on-bg)}
.chip.mine{background:var(--on-bg);color:var(--bg);font-weight:700}
.chip .who{opacity:.75}
.chip.mine .who{opacity:.85}
.chip .pip{width:7px;height:7px;border-radius:99px;flex:0 0 7px;background:currentColor;opacity:.5}
.chip.taken .pip{opacity:1}

/* Übernahme- und Namensdialog */
.sheet{position:fixed;inset:0;background:rgba(8,12,16,.72);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:50}
.sheet.hidden{display:none}
.sheet-box{background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;
  width:100%;max-width:26rem;max-height:90vh;overflow:auto}
.sheet-box h2{font-size:1.2rem;font-weight:900;margin-bottom:10px}
.sheet-box p{font-size:.9rem;color:var(--dim);line-height:1.5;margin-bottom:16px}
.danger{width:100%;background:#FF1744;color:#fff;border-radius:10px;padding:15px;font-weight:700}

/* Verwaltung */
.admin-area{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:6px}
.field input{background:var(--ink);padding:12px}
.two{display:flex;gap:10px}
.two .field{flex:1}
.ent-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ent-edit input{background:var(--ink);padding:10px 12px;font-size:.95rem}
.icon-btn{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.8rem;color:var(--dim)}
.ok-flash{color:#00C853;font-size:.85rem;font-weight:700;margin-inline-start:10px}
</style>
</head>
<body>

<!-- ============ Passwort ============ -->
<section id="lock" class="screen on">
  <div class="wrap">
    <div class="eyebrow">inug</div>
    <h1 data-i18n="lock.heading"></h1>
    <div style="height:28px"></div>
    <input id="pw" type="password" data-i18n-ph="lock.password" autocomplete="current-password">
    <p id="pw-err" class="err hidden" data-i18n="lock.wrong"></p>
    <button id="pw-go" class="big-btn" data-i18n="lock.unlock"></button>
    <div class="langrow">
      <label for="lang-lock" data-i18n="lock.language"></label>
      <select id="lang-lock" class="lang"></select>
    </div>
  </div>
</section>

<!-- ============ Bereiche ============ -->
<section id="list" class="screen">
  <div class="wrap">
    <div class="head">
      <h1 data-i18n="list.heading"></h1>
      <button id="edit-toggle" class="dim hidden" style="font-size:.9rem"></button>
    </div>
    <div id="areas"></div>
    <div id="list-error" class="empty hidden" style="border-color:#FF1744">
      <b style="color:#FF1744" data-i18n="list.errorTitle"></b>
      <span class="dim" style="font-size:.9rem" data-i18n="list.errorText"></span>
    </div>
    <div id="area-empty" class="empty hidden">
      <b data-i18n="list.emptyTitle"></b>
      <span class="dim" style="font-size:.9rem" data-i18n="list.emptyText"></span>
    </div>

    <div id="new-form" class="form hidden">
      <input id="new-name" data-i18n-ph="list.name">
      <input id="new-max" inputmode="numeric" data-i18n-ph="list.max">
      <div class="form-actions">
        <button id="new-save" class="big-btn" data-i18n="list.create"></button>
        <button id="new-cancel" class="cancel" data-i18n="list.cancel"></button>
      </div>
    </div>
    <button id="new-open" class="ghost-btn" data-i18n="list.newArea"></button>

    <div class="langrow" style="margin-top:28px">
      <label for="lang-list" data-i18n="lock.language"></label>
      <select id="lang-list" class="lang"></select>
    </div>

    <button id="admin-open" class="ghost-btn" style="margin-top:12px" data-i18n="list.admin"></button>

    <p class="note"><span data-i18n="list.sharedNote"></span></p>
  </div>
</section>

<!-- ============ Raum ============ -->
<section id="room" class="screen">
  <div class="bar-top">
    <button id="room-back"><span class="chev">‹</span> <span data-i18n="room.back"></span></button>
    <span class="title" id="room-title"></span>
    <button id="room-stats" data-i18n="room.stats"></button>
  </div>
  <div class="statusbar"><span id="offline"></span></div>
  <div class="doors" id="room-doors"></div>
  <div class="stage">
    <div id="count" class="count tabular">–</div>
    <div class="of" id="room-of"></div>
    <div class="gauge"><i id="gauge"></i></div>
    <div id="status" class="status"></div>
    <button id="reset-ask" class="subtle" data-i18n="room.reset"></button>
    <div id="reset-confirm" class="confirm hidden">
      <span style="opacity:.8" data-i18n="room.resetAsk"></span>
      <button id="reset-yes" class="yes" data-i18n="room.resetYes"></button>
      <button id="reset-no" style="opacity:.7" data-i18n="room.resetNo"></button>
    </div>
  </div>
  <div class="pads">
    <button id="minus" class="pad minus"><span class="sign">−</span><span class="lbl" data-i18n="room.out"></span></button>
    <button id="plus" class="pad plus"><span class="sign">+</span><span class="lbl" data-i18n="room.in"></span></button>
  </div>
</section>

<!-- ============ Eingang wählen ============ -->
<section id="entrances" class="screen">
  <div class="wrap">
    <div class="head" style="align-items:center">
      <button id="ent-back" class="dim" style="font-size:.9rem"><span class="chev">‹</span> <span data-i18n="common.back"></span></button>
      <span style="font-weight:700" id="ent-area"></span>
      <span style="width:3.5rem"></span>
    </div>
    <h1 data-i18n="ent.heading"></h1>
    <p class="dim" style="font-size:.9rem;margin:8px 0 20px" data-i18n="ent.pick"></p>
    <div id="ent-list"></div>
    <div id="ent-empty" class="empty hidden">
      <b data-i18n="ent.none"></b>
      <span class="dim" style="font-size:.9rem" data-i18n="ent.noneHint"></span>
    </div>
  </div>
</section>

<!-- ============ Verwaltung ============ -->
<section id="admin" class="screen">
  <div class="wrap">
    <div class="head" style="align-items:center">
      <button id="admin-back" class="dim" style="font-size:.9rem"><span class="chev">‹</span> <span data-i18n="common.back"></span></button>
      <span style="width:3.5rem"></span>
    </div>
    <h1 style="margin-bottom:20px" data-i18n="admin.heading"></h1>

    <div id="admin-gate">
      <input id="admin-pw" type="password" data-i18n-ph="admin.password" autocomplete="off">
      <p id="admin-err" class="err hidden" data-i18n="admin.wrong"></p>
      <button id="admin-go" class="big-btn" data-i18n="admin.unlock"></button>
    </div>

    <div id="admin-body" class="hidden"></div>
  </div>
</section>

<!-- ============ Statistik ============ -->
<section id="stats" class="screen">
  <div class="wrap">
    <div class="head" style="align-items:center">
      <button id="stats-back" class="dim" style="font-size:.9rem"><span class="chev">‹</span> <span data-i18n="stats.back"></span></button>
      <span style="font-weight:700" id="stats-title"></span>
      <span style="width:3.5rem"></span>
    </div>
    <h1 style="margin-bottom:16px" data-i18n="stats.heading"></h1>
    <input id="stats-day" type="date" style="margin-bottom:24px">
    <div id="stats-body"></div>
  </div>
</section>

<!-- ============ Dialoge ============ -->
<div id="sheet-name" class="sheet hidden">
  <div class="sheet-box">
    <h2 id="sheet-name-title"></h2>
    <p data-i18n="ent.nameHint"></p>
    <input id="claim-name" data-i18n-ph="ent.yourName" autocomplete="name">
    <button id="claim-go" class="big-btn" data-i18n="ent.start"></button>
    <button id="claim-cancel" class="ghost-btn" data-i18n="common.cancel"></button>
  </div>
</div>

<div id="sheet-takeover" class="sheet hidden">
  <div class="sheet-box">
    <h2 id="takeover-title"></h2>
    <p id="takeover-text"></p>
    <button id="takeover-go" class="danger" data-i18n="ent.takeover"></button>
    <button id="takeover-cancel" class="ghost-btn" data-i18n="common.cancel"></button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { sprachenSortiert, uebersetze, spracheRaten, istRtl } from './i18n.js';

/* ================================================================
   EINSTELLUNGEN – hier die eigenen Werte eintragen.
   Supabase → Project Settings → API
   ================================================================ */
const SUPABASE_URL      = 'https://timggyhfiwespnfzxxbv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_dqPQ2p7rBLYFw9PoxmvRxw_icmYIXgR';
const PASSWORT          = 'ibugiscounting';
const ADMIN_PASSWORT    = 'responsible4counting';
const ZEITZONE          = 'Europe/Berlin';
/* ============================================================== */

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const t = (schluessel, werte) => uebersetze(sprache, schluessel, werte);

/* Setzt alle Texte im Markup neu. Laeuft beim Start und bei jedem Wechsel. */
function spracheAnwenden() {
  document.documentElement.lang = sprache;
  document.documentElement.dir = istRtl(sprache) ? 'rtl' : 'ltr';
  document.title = 'inug – ' + t('app.title');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });

  // Texte, die von Zustand oder Zahlen abhaengen
  $('edit-toggle').textContent = t(bearbeiten ? 'list.done' : 'list.edit');
  document.querySelectorAll('.lang').forEach(sel => { sel.value = sprache; });
  if (bereich && $('room').classList.contains('on')) { zeichne(); tuerenZeichnen(); }
  if (bereich && $('stats').classList.contains('on')) statistikLaden();
  if ($('list').classList.contains('on')) bereicheLaden();
  if ($('entrances').classList.contains('on')) eingaengeLaden();
  if (adminOffen) adminZeichnen();
  banner();
}

function spracheWaehlen(code) {
  sprache = code;
  localStorage.setItem('inug:lang', code);
  spracheAnwenden();
}

function sprachauswahlBauen() {
  document.querySelectorAll('.lang').forEach(sel => {
    sel.innerHTML = '';
    for (const s of sprachenSortiert()) {
      const o = document.createElement('option');
      o.value = s.code; o.textContent = s.name;
      sel.appendChild(o);
    }
    sel.value = sprache;
    sel.onchange = (e) => spracheWaehlen(e.target.value);
  });
}

const zahl = (n, stellen = 0) => new Intl.NumberFormat(sprache, {
  minimumFractionDigits: stellen, maximumFractionDigits: stellen }).format(n);

const zwei = (n) => String(n).padStart(2, '0');
const tagVon = (d = new Date()) => `${d.getFullYear()}-${zwei(d.getMonth()+1)}-${zwei(d.getDate())}`;
const uhr = (ts) => { const d = new Date(ts); return `${zwei(d.getHours())}:${zwei(d.getMinutes())}`; };

let bereich = null;      // aktuell geöffneter Bereich
let serverStand = 0;     // letzter von der Datenbank bestätigter Stand
let ausstehend = [];     // Klicks, die noch nicht gespeichert werden konnten
let sendetGerade = false;
let netzOk = true;
let sprache = localStorage.getItem('inug:lang') || spracheRaten();
let stockt = false;      // letzter Sendeversuch ist fehlgeschlagen
let bannerTimer = null;
const GEDULD = 2500;     // ms, bevor ein liegengebliebener Klick gemeldet wird
let kanal = null;
let abgleichTimer = null;
let bearbeiten = false;
let wakeLock = null;
let eingang = null;        // { id, name } – der belegte Eingang
let zaehlerName = '';      // wer steht gerade an dieser Tür
let entKanal = null;       // Live-Verbindung zu den Belegungen
let herzTimer = null;
const TOKEN = geraeteToken();   // identifiziert dieses Gerät als Inhaber

/* Bleibt über Neustarts gleich, damit ein neu geladenes Gerät seine
   eigene Belegung wiedererkennt statt sich selbst zu verdrängen. */
function geraeteToken() {
  let v = localStorage.getItem('inug:token');
  if (!v) { v = neueKennung(); localStorage.setItem('inug:token', v); }
  return v;
}

/* "vor 3 Min." bzw. "gerade aktiv" */
function seit(ts) {
  if (!ts) return t('ent.justNow');
  const min = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
  return min < 1 ? t('ent.justNow') : t('ent.lastSeen', { min });
}

/* ---------- Bildschirmwechsel ---------- */
function zeige(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id !== 'room') document.body.className = '';
  window.scrollTo(0, 0);
}

function verbindung(ok) { netzOk = ok; banner(); }

function banner() {
  const el = $('offline');
  if (!el) return;
  clearTimeout(bannerTimer);
  bannerTimer = null;

  const n = ausstehend.length;
  if (n === 0) stockt = false;

  // Ein frisch abgeschickter Klick ist kein Problem – erst wenn der
  // Versuch fehlschlägt oder ungewöhnlich lange dauert, wird gemeldet.
  const wartetSeit = n > 0 ? Date.now() - (ausstehend[0].t || 0) : 0;
  const haengt = n > 0 && (stockt || wartetSeit > GEDULD);

  if (netzOk && !haengt) {
    el.classList.remove('show');
    // Läuft noch etwas, später nochmal nachsehen
    if (n > 0) bannerTimer = setTimeout(banner, Math.max(200, GEDULD - wartetSeit));
    return;
  }

  if (n > 0) {
    el.style.background = '#101820';
    el.style.color = '#FFFFFF';
    el.textContent = t('banner.pending', { n });
  } else {
    el.style.background = '#FFFFFF';
    el.style.color = '#D50000';
    el.textContent = t('banner.offline');
  }
  el.classList.add('show');
}

   ================================================================ */
function zustand(c, max, warnProzent = 80) {
  if (!max) return 'ok';
  const q = (c / max) * 100;
  return q >= 100 ? 'full' : q >= warnProzent ? 'warn' : 'ok';
}
const AKZENT = { ok:'#00C853', warn:'#FFC400', full:'#FF1744' };

async function bereicheLaden() {
  const { data, error } = await sb.from('area_status').select('*').order('name');
  verbindung(!error);
  $('list-error').classList.toggle('hidden', !error);
  if (error) { $('area-empty').classList.add('hidden'); return; }

  const box = $('areas');
  box.innerHTML = '';
  $('area-empty').classList.toggle('hidden', data.length > 0);
  $('edit-toggle').classList.toggle('hidden', data.length === 0);

  data.forEach(b => {
    const z = zustand(b.current_count, b.max_guests, b.warn_percent);
    const pct = Math.min(100, b.max_guests ? (b.current_count / b.max_guests) * 100 : 0);

    const row = document.createElement('div');
    row.className = 'row';

    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <span class="card-name"></span>
        <span class="card-count tabular" style="color:${AKZENT[z]}">
          ${b.current_count}<span class="dim" style="font-size:.85rem;font-weight:500"> / ${b.max_guests}</span>
        </span>
      </div>
      <div class="bar"><i style="width:${pct}%;background:${AKZENT[z]}"></i></div>`;
    card.querySelector('.card-name').textContent = b.name;
    card.onclick = () => eingaengeOeffnen(b);
    row.appendChild(card);

    if (bearbeiten) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = t('list.delete');
      del.onclick = async () => {
        if (!confirm(t('list.deleteConfirm', { name: b.name }))) return;
        await sb.from('areas').delete().eq('id', b.id);
        bereicheLaden();
      };
      row.appendChild(del);
    }
    box.appendChild(row);
  });
}

let eingaenge = [];
let gewaehlt = null;          // Eingang, der gerade belegt werden soll

async function eingaengeOeffnen(b) {

async function eingaengeLaden() {
  if (!bereich) return;
  const { data, error } = await sb.from('entrances')
    .select('*').eq('area_id', bereich.id).order('name');
  verbindung(!error);
  if (error) return;

  eingaenge = data;
  tuerenZeichnen();

  const box = $('ent-list');
  box.innerHTML = '';
  $('ent-empty').classList.toggle('hidden', data.length > 0);

/* Zeigt im Zählbildschirm, wer gerade an welcher Tür steht.
   Zeichnet aus den zuletzt geladenen Daten, ohne neue Abfrage –
   dadurch bleibt "aktiv vor X Min." aktuell, ohne die Datenbank
   im Sekundentakt zu belasten. */
function tuerenZeichnen() {
  const box = $('room-doors');
  if (!box) return;
  box.innerHTML = '';
  if (!bereich) return;

  for (const e of eingaenge) {
    const selbst = e.holder_token === TOKEN;
    const besetzt = !!e.holder_token;

    const c = document.createElement('span');
    c.className = 'chip' + (selbst ? ' mine' : '') + (besetzt ? ' taken' : '');
    c.innerHTML = '<span class="pip"></span><span class="nm"></span><span class="who"></span>';
    c.querySelector('.nm').textContent = e.name;
    c.querySelector('.who').textContent = besetzt
      ? (e.held_by || '?') + (selbst ? '' : ' \u00b7 ' + seit(e.last_seen))
      : t('ent.free');
    box.appendChild(c);
  }
}

/* Live: fremde Belegungen erscheinen sofort in der Liste. */
async function entAbonnieren() {
  if (entKanal) { await sb.removeChannel(entKanal); entKanal = null; }
  if (!bereich) return;
  const id = bereich.id;
  entKanal = sb.channel(`ent:${id}`)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'entrances', filter: `area_id=eq.${id}` },
      (p) => {
        // Wurde uns unser eigener Eingang weggenommen?
        if (eingang && p.new && p.new.id === eingang.id && p.new.holder_token !== TOKEN) {
          rausgeworfen();
          return;
        }
        if ($('entrances').classList.contains('on') || $('room').classList.contains('on'))
          eingaengeLaden();
      })
    .subscribe();
}

function eingangWaehlen(e) {
  gewaehlt = e;
  $('sheet-name-title').textContent = e.name;
  $('claim-name').value = localStorage.getItem('inug:name') || '';
  $('sheet-name').classList.remove('hidden');

}

$('claim-cancel').onclick = () => { $('sheet-name').classList.add('hidden'); gewaehlt = null; };
$('claim-name').onkeydown = (e) => { if (e.key === 'Enter') $('claim-go').click(); };
$('claim-go').onclick = () => belegen(false);
$('takeover-cancel').onclick = () => $('sheet-takeover').classList.add('hidden');
$('takeover-go').onclick = () => { $('sheet-takeover').classList.add('hidden'); belegen(true); };

async function belegen(erzwingen) {
  const name = $('claim-name').value.trim();
  if (!name || !gewaehlt) return;
  localStorage.setItem('inug:name', name);

  const { data, error } = await sb.rpc('claim_entrance', {
    p_entrance_id: gewaehlt.id, p_name: name, p_token: TOKEN, p_force: erzwingen,
  });
  if (error) { alert(t('ent.claimFailed', { msg: error.message })); return; }

  const r = Array.isArray(data) ? data[0] : data;
  if (!r || !r.ok) {

    $('takeover-text').textContent  = t('ent.takeoverText', { when: seit(r?.last_seen) });

    return;
  }

  $('sheet-name').classList.add('hidden');

/* Belegung wieder aufgeben – beim Verlassen und beim Schließen der Seite. */
async function freigeben() {
  clearInterval(herzTimer); herzTimer = null;
  if (!eingang) return;
  const id = eingang.id;
  eingang = null;
  try { await sb.rpc('release_entrance', { p_entrance_id: id, p_token: TOKEN }); } catch {}
}

/* Lebenszeichen: hält "aktiv vor X Min." aktuell und meldet Übernahmen
   auch dann, wenn die Live-Verbindung gerade weg ist. */
function herzschlagStarten() {
  clearInterval(herzTimer);
  herzTimer = setInterval(async () => {
    if (!eingang) return;
    const { data, error } = await sb.rpc('touch_entrance', {
      p_entrance_id: eingang.id, p_token: TOKEN });
    if (!error && data === false) rausgeworfen();
  }, 30000);
}

async function rausgeworfen() {
  if (!eingang) return;
  eingang = null;
  clearInterval(herzTimer); herzTimer = null;
  await raumVerlassen(false);
  alert(t('ent.kicked'));
}

/* ================================================================
   Raum
   ================================================================ */
async function raumOeffnen(b) {
  bereich = b;
  serverStand = b.current_count;
  ausstehend = outboxLaden(b.id);
  $('room-title').textContent = eingang ? `${b.name} \u00b7 ${eingang.name}` : b.name;
  $('room-of').textContent = t('room.of', { max: b.max_guests });
  $('reset-confirm').classList.add('hidden');
  $('reset-ask').classList.remove('hidden');
  zeige('room');
  zeichne();
  tuerenZeichnen();
  bildschirmWach();

  if (kanal) await sb.removeChannel(kanal);
  await abonnieren();
  senden();                       // liegengebliebene Klicks nachreichen
  herzschlagStarten();
  clearInterval(abgleichTimer);
  abgleichTimer = setInterval(() => { senden(); abgleichen(); tuerenZeichnen(); }, 5000);
}

/* Live-Verbindung zum Bereich. Bricht sie ab, wird neu verbunden –
   sonst friert die Zahl unbemerkt ein. */
async function abonnieren() {
  if (!bereich) return;
  if (kanal) { await sb.removeChannel(kanal); kanal = null; }
  const id = bereich.id;
  kanal = sb.channel(`area:${id}`)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'count_events', filter: `area_id=eq.${id}` },
      (p) => {
        const r = p.new;
        // War das ein eigener Klick, gilt er hiermit als bestätigt
        const i = ausstehend.findIndex(e => e.id === r.client_event_id);
        if (i !== -1) { ausstehend.splice(i, 1); outboxSpeichern(); }
        serverStand = r.resulting_count;
        zeichne();
      })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') { verbindung(true); senden(); abgleichen(); }
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        verbindung(false);
        setTimeout(abonnieren, 2000);
      }
    });
}

/* Sicherheitsnetz: holt den echten Serverstand. Noch nicht gesendete
   Klicks bleiben davon unberührt, sie liegen ja obendrauf. */
async function abgleichen() {
  if (!bereich) return;
  const { data, error } = await sb
    .from('area_status').select('current_count').eq('id', bereich.id).maybeSingle();
  verbindung(!error);
  if (error || !data) return;
  if (data.current_count !== serverStand) { serverStand = data.current_count; zeichne(); }
}

/* ---------- Warteschlange ---------- */

// Angezeigter Stand = bestätigter Serverstand + alles, was noch unterwegs ist
function anzeige() {
  return Math.max(0, serverStand + ausstehend.reduce((s, e) => s + e.delta, 0));
}

function outboxSchluessel(id) { return `inug:outbox:${id}`; }
function outboxLaden(id) {
  try { return JSON.parse(localStorage.getItem(outboxSchluessel(id))) || []; }
  catch { return []; }
}
function outboxSpeichern() {
  if (!bereich) return;
  localStorage.setItem(outboxSchluessel(bereich.id), JSON.stringify(ausstehend));
  banner();
}

function neueKennung() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
    (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
}

/* Arbeitet die Warteschlange der Reihe nach ab. Schlägt ein Aufruf fehl,
   bleibt er stehen und wird beim nächsten Versuch erneut geschickt. */
async function senden() {
  if (sendetGerade || !bereich || ausstehend.length === 0) return;
  sendetGerade = true;
  try {
    while (ausstehend.length > 0 && bereich) {
      const e = ausstehend[0];
      const { data, error } = await sb.rpc('adjust_count', {
        p_area_id: bereich.id,
        p_delta: e.delta,
        p_entrance_id: eingang ? eingang.id : null,
        p_counted_by: zaehlerName || null,
        p_client_event_id: e.id,
      });
      if (error) { stockt = true; verbindung(false); break; }
      const i = ausstehend.findIndex(x => x.id === e.id);
      if (i !== -1) { ausstehend.splice(i, 1); outboxSpeichern(); }
      if (typeof data === 'number') serverStand = data;
      stockt = false;
      zeichne();
    }
    if (ausstehend.length === 0) { stockt = false; verbindung(true); }
  } finally {
    sendetGerade = false;
  }
}

/* ---------- Anzeige ---------- */

function zeichne(puls) {
  if (!bereich) return;
  const wert = anzeige();
  const z = zustand(wert, bereich.max_guests, bereich.warn_percent);
  document.body.className = 'state-' + z;
  const el = $('count');
  el.textContent = wert;
  if (puls) { el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 160); }
  $('gauge').style.width = Math.min(100, (wert / bereich.max_guests) * 100) + '%';
  const frei = Math.max(0, bereich.max_guests - wert);
  $('room-of').textContent = t('room.of', { max: bereich.max_guests });
  $('status').textContent = wert >= bereich.max_guests
    ? t('room.full')
    : t('room.free', { n: frei });
  $('minus').disabled = wert === 0;
  banner();
}

/* Ein Klick landet zuerst in der Warteschlange – nie direkt im Netz.
   Dadurch geht auch ohne Empfang nichts verloren. */
function zaehlen(delta) {
  if (delta < 0 && anzeige() === 0) return;
  ausstehend.push({ id: neueKennung(), delta, t: Date.now() });
  outboxSpeichern();
  zeichne(true);
  if (navigator.vibrate) navigator.vibrate(12);
  senden();
}

$('plus').onclick  = () => zaehlen(1);
$('minus').onclick = () => zaehlen(-1);

   Statistik
   ================================================================ */
$('room-stats').onclick = () => {

async function statistikLaden() {
  const tag = $('stats-day').value;
  if (!tag) return;
  const body = $('stats-body');
  body.innerHTML = `<p class="dim">${t('stats.loading')}</p>`;

  const [{ data: s, error: e1 }, { data: h, error: e2 }] = await Promise.all([
    sb.rpc('day_stats',   { p_area_id: bereich.id, p_day: tag, p_tz: ZEITZONE }),
    sb.rpc('day_history', { p_area_id: bereich.id, p_day: tag, p_tz: ZEITZONE }),
  ]);

  if (e1 || e2) { body.innerHTML = `<p class="dim">${t('stats.loadError')}</p>`; return; }
  const k = Array.isArray(s) ? s[0] : s;
  if (!k || !k.first_at || !h || h.length === 0) {
    body.innerHTML = `<div class="empty"><b>${t('stats.noDataTitle')}</b>
      <span class="dim" style="font-size:.9rem">${t('stats.noDataText')}</span></div>`;
    return;
  }

  const schnitt = zahl(Number(k.avg_occupancy), 1);
  const peakRot = k.peak >= bereich.max_guests;

  body.innerHTML = `
    <div class="grid">
      <div class="kpi"><div class="n tabular" style="color:#00C853">${zahl(k.total_in)}</div><div class="l">${t('stats.totalIn')}</div></div>
      <div class="kpi"><div class="n tabular" style="color:#FFC400">${zahl(k.total_out)}</div><div class="l">${t('stats.totalOut')}</div></div>
      <div class="kpi"><div class="n tabular">${schnitt}</div><div class="l">${t('stats.average')}</div></div>
      <div class="kpi"><div class="n tabular" style="${peakRot ? 'color:#FF1744' : ''}">${zahl(k.peak)}</div><div class="l">${t('stats.peak', { time: uhr(k.peak_at) })}</div></div>
    </div>
    <div class="chart">
      <div class="chart-head">
        <span style="font-weight:700">${t('stats.history')}</span>
        <span class="dim" style="font-size:.85rem" dir="ltr">${uhr(k.first_at)} – ${uhr(k.last_at)}</span>
      </div>
      ${verlaufSvg(h, tag)}
      <p class="dim" style="font-size:.75rem;margin-top:12px;line-height:1.5">
        ${t('stats.footnote', { max: bereich.max_guests })}
      </p>
    </div>`;
}

function verlaufSvg(rows, tag) {
  const W = 620, H = 220, L = 38, R = 10, T = 10, B = 26;
  const punkte = rows.map(r => ({ t: new Date(r.at).getTime(), c: r.occupancy }));
  // Startpunkt und aktueller Rand ergänzen, damit die Treppe sauber beginnt und endet
  const ende = tag === tagVon() ? Date.now() : punkte[punkte.length - 1].t;
  punkte.push({ t: Math.max(ende, punkte[punkte.length - 1].t), c: punkte[punkte.length - 1].c });

  const t0 = punkte[0].t, t1 = punkte[punkte.length - 1].t;
  const span = Math.max(1, t1 - t0);
  const yMax = Math.max(bereich.max_guests, ...punkte.map(p => p.c), 1);
  const x = (t) => L + ((t - t0) / span) * (W - L - R);
  const y = (c) => T + (1 - c / yMax) * (H - T - B);

  let d = `M ${x(punkte[0].t)} ${y(punkte[0].c)}`;
  for (let i = 1; i < punkte.length; i++) {
    d += ` L ${x(punkte[i].t)} ${y(punkte[i - 1].c)} L ${x(punkte[i].t)} ${y(punkte[i].c)}`;
  }

  // Gitter + Y-Beschriftung
  let gitter = '';
  const stufen = 4;
  for (let i = 0; i <= stufen; i++) {
    const v = Math.round((yMax / stufen) * i);
    const yy = y(v);
    gitter += `<line x1="${L}" y1="${yy}" x2="${W - R}" y2="${yy}" stroke="#31404E" stroke-width="1"/>
               <text x="${L - 8}" y="${yy + 4}" fill="#93A4B2" font-size="11" text-anchor="end">${v}</text>`;
  }
  // Kapazitätslinie
  const yk = y(bereich.max_guests);
  gitter += `<line x1="${L}" y1="${yk}" x2="${W - R}" y2="${yk}" stroke="#FF1744" stroke-width="1.5" stroke-dasharray="5 4" opacity=".9"/>`;

  // X-Beschriftung
  let achse = '';
  for (let i = 0; i <= 3; i++) {
    const t = t0 + (span / 3) * i;
    achse += `<text x="${x(t)}" y="${H - 6}" fill="#93A4B2" font-size="11"
              text-anchor="${i === 0 ? 'start' : i === 3 ? 'end' : 'middle'}">${uhr(t)}</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" dir="ltr"
            aria-label="${t('stats.chartLabel')}">
      ${gitter}${achse}
      <path d="${d}" fill="none" stroke="#00C853" stroke-width="3"
            stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>`;
}

/* ================================================================
   Verwaltung
   ================================================================ */
let adminOffen = false;
let adminDaten = [];

$('admin-open').onclick = () => {
  adminOffen = false;
  $('admin-body').classList.add('hidden');
  $('admin-gate').classList.remove('hidden');
  $('admin-err').classList.add('hidden');
  $('admin-pw').value = '';
  zeige('admin');
  $('admin-pw').focus();
};
$('admin-back').onclick = () => { adminOffen = false; zeige('list'); bereicheLaden(); };
$('admin-pw').onkeydown = (e) => { if (e.key === 'Enter') $('admin-go').click(); };
$('admin-pw').oninput = () => $('admin-err').classList.add('hidden');

$('admin-go').onclick = async () => {
  if ($('admin-pw').value.trim() !== ADMIN_PASSWORT) {
    $('admin-err').classList.remove('hidden');
    $('admin-pw').value = '';
    return;
  }
  adminOffen = true;
  $('admin-gate').classList.add('hidden');
  $('admin-body').classList.remove('hidden');
  await adminLaden();
};

async function adminLaden() {
  $('admin-body').innerHTML = `<p class="dim">${t('stats.loading')}</p>`;
  const [{ data: a, error: e1 }, { data: e, error: e2 }] = await Promise.all([
    sb.from('areas').select('*').order('name'),
    sb.from('entrances').select('*').order('name'),
  ]);
  if (e1 || e2) { $('admin-body').innerHTML = `<p class="dim">${t('stats.loadError')}</p>`; return; }
  adminDaten = a.map(x => ({ ...x, tueren: e.filter(y => y.area_id === x.id) }));
  adminZeichnen();
}

function adminZeichnen() {
  const box = $('admin-body');
  box.innerHTML = '';
  if (adminDaten.length === 0) {
    box.innerHTML = `<div class="empty"><b>${t('admin.noAreas')}</b></div>`;
    return;
  }

  for (const a of adminDaten) {
    const k = document.createElement('div');
    k.className = 'admin-area';
    k.innerHTML = `
      <div class="field">
        <label>${t('admin.areaName')}</label>
        <input class="a-name" value="">
      </div>
      <div class="two">
        <div class="field"><label>${t('admin.capacity')}</label>
          <input class="a-max" inputmode="numeric" value="${a.max_guests}"></div>
        <div class="field"><label>${t('admin.warn')} (${t('admin.warnUnit')})</label>
          <input class="a-warn" inputmode="numeric" value="${a.warn_percent}"></div>
      </div>
      <button class="big-btn a-save" style="margin-top:4px">${t('common.save')}</button>
      <span class="ok-flash hidden">${t('common.saved')}</span>

      <div style="margin-top:22px;font-weight:700;font-size:.95rem">${t('admin.entrances')}</div>
      <div class="t-list" style="margin-top:10px"></div>
      <button class="ghost-btn t-add" style="margin-top:4px">${t('admin.addEntrance')}</button>`;

    k.querySelector('.a-name').value = a.name;
    const flash = k.querySelector('.ok-flash');

    k.querySelector('.a-save').onclick = async () => {
      const name = k.querySelector('.a-name').value.trim();
      const max  = parseInt(k.querySelector('.a-max').value, 10);
      const warn = parseInt(k.querySelector('.a-warn').value, 10);
      if (!name || !max || max < 1 || !warn || warn < 1 || warn > 100) return;
      const { error } = await sb.from('areas')
        .update({ name, max_guests: max, warn_percent: warn }).eq('id', a.id);
      if (error) { alert(t('admin.saveFailed', { msg: error.message })); return; }
      Object.assign(a, { name, max_guests: max, warn_percent: warn });
      flash.classList.remove('hidden');
      setTimeout(() => flash.classList.add('hidden'), 1600);
    };

    // Türen
    const liste = k.querySelector('.t-list');
    for (const tuer of a.tueren) {
      const z = document.createElement('div');
      z.className = 'ent-edit';
      z.innerHTML = `<input class="t-name"><button class="icon-btn t-del">${t('common.delete')}</button>`;
      z.querySelector('.t-name').value = tuer.name;

      // Umbenennen beim Verlassen des Feldes
      z.querySelector('.t-name').onchange = async (ev) => {
        const nm = ev.target.value.trim();
        if (!nm || nm === tuer.name) { ev.target.value = tuer.name; return; }
        const { error } = await sb.from('entrances').update({ name: nm }).eq('id', tuer.id);
        if (error) { alert(t('admin.saveFailed', { msg: error.message })); ev.target.value = tuer.name; return; }
        tuer.name = nm;
      };

      z.querySelector('.t-del').onclick = async () => {
        if (!confirm(t('admin.deleteEntranceConfirm', { name: tuer.name }))) return;
        await sb.from('entrances').delete().eq('id', tuer.id);
        adminLaden();
      };

      // Belegte Tür: Hinweis und Möglichkeit, sie freizugeben
      if (tuer.holder_token) {
        const info = document.createElement('div');
        info.style.cssText = 'display:flex;align-items:center;gap:10px;margin:-2px 0 10px;font-size:.8rem';
        info.innerHTML = `<span style="color:#FFC400"></span>
                          <button class="icon-btn t-free">${t('admin.release')}</button>`;
        info.querySelector('span').textContent =
          t('admin.occupiedBy', { name: tuer.held_by || '?' }) + ' \u00b7 ' + seit(tuer.last_seen);
        info.querySelector('.t-free').onclick = async () => {
          await sb.rpc('admin_release_entrance', { p_entrance_id: tuer.id });
          adminLaden();
        };
        liste.appendChild(z);
        liste.appendChild(info);
      } else {
        liste.appendChild(z);
      }
    }

    k.querySelector('.t-add').onclick = async () => {
      const nm = prompt(t('admin.entranceName'), t('entrance.default'));
      if (!nm || !nm.trim()) return;
      const { error } = await sb.from('entrances').insert({ area_id: a.id, name: nm.trim() });
      if (error) { alert(t('admin.saveFailed', { msg: error.message })); return; }
      adminLaden();
    };

    box.appendChild(k);
  }
}

/* ================================================================
   Start
   ================================================================ */
sprachauswahlBauen();
spracheAnwenden();

if (localStorage.getItem('inug:unlocked') === '1') entsperrt();
else $('pw').focus();

window.addEventListener('online',  () => { verbindung(true); abonnieren(); senden(); });
window.addEventListener('offline', () => verbindung(false));
</script>
